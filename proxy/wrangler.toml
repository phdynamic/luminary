name = "luminary-proxy"
main = "worker.js"
compatibility_date = "2026-10-01"

# Sites allowed to call the proxy (comma-separated). Use scheme and domain only: browsers never
# send a path, so "https://phdynamic.github.io/luminary" would block every request.
[vars]
ALLOWED_ORIGINS = "https://phdynamic.github.io"

# Logs are on so failed upstream requests (logged by worker.js) show up in the dashboard
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false
