<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luminary — Free Image Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0b14;
    --bg2: #13101f;
    --bg3: #1a1628;
    --surface: #1f1a30;
    --surface2: #2a2340;
    --border: rgba(160,130,255,0.12);
    --border2: rgba(160,130,255,0.25);
    --purple: #a87fff;
    --purple2: #c9a8ff;
    --purple3: #7c5cbf;
    --accent: #e0c8ff;
    --muted: #958ab5;
    --text: #ede8ff;
    --text2: #b8aed4;
    --text3: #958ab5;
    --danger: #ff6b8a;
    --success: #7affb8;
    --tag-bg: rgba(168,127,255,0.12);
    --radius: 12px;
    --radius2: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-y: scroll; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(140,90,255,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 50% 50% at 80% 80%, rgba(100,60,200,0.05) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .app { position: relative; z-index: 1; max-width: 1300px; margin: 0 auto; padding: 0 24px 80px; }

  /* ---- Header ---- */
  header { padding: 40px 0 36px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; flex-direction: column; gap: 4px; }
  .btn-collection { background: transparent; border: 1px solid var(--border2); color: var(--text2); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; padding: 8px 16px; border-radius: 20px; cursor: pointer; transition: border-color 0.15s, color 0.15s; white-space: nowrap; }
  .btn-collection:hover { border-color: var(--purple); color: var(--purple2); }
  .btn-collection .star { color: #ffd166; }
  .logo { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; color: var(--accent); }
  .logo span { color: var(--purple); }
  .tagline { font-size: 13px; color: var(--muted); font-weight: 300; letter-spacing: 0.02em; }

  /* ---- Search Area ---- */
  .search-area { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 16px; }
  .search-row { display: flex; gap: 10px; align-items: stretch; margin: 0; }
  .search-input-wrap { flex: 1; position: relative; }
  .search-input-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  #searchQuery { width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius2); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; padding: 11px 14px 11px 42px; outline: none; transition: border-color 0.2s; }
  #searchQuery:focus { border-color: var(--purple2); box-shadow: 0 0 0 1px var(--purple2); }
  .btn-search { background: var(--purple3); border: 1px solid var(--purple); color: var(--accent); font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 600; padding: 11px 28px; border-radius: var(--radius2); cursor: pointer; transition: background 0.2s, transform 0.1s; white-space: nowrap; }
  .btn-search:hover { background: rgba(124,92,191,0.9); }
  .btn-search:active { transform: scale(0.98); }

  .controls-row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .filters-row { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 2px; }
  .control-group { display: flex; flex-direction: column; gap: 6px; }
  .group-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

  /* Source chips */
  .source-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border2); background: transparent; color: var(--text2); font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; user-select: none; line-height: 1.6; }
  .chip:hover { border-color: var(--purple); color: var(--purple2); }
  .chip.active { background: var(--tag-bg); border-color: var(--purple); color: var(--purple2); }
  .chip .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .dot-pexels { background: #05a081; }
  .dot-unsplash { background: #888; }
  .dot-pixabay { background: #2ec66d; }
  .dot-openverse { background: #e5a423; }
  .dot-wikimedia { background: #069; }
  .dot-nasa { background: #fc3d21; }
  .dot-iconify { background: #1769aa; }

  /* Free-only toggle */
  .toggle-wrap { display: flex; align-items: center; gap: 8px; }
  .toggle-label { font-size: 12px; color: var(--text2); font-weight: 500; white-space: nowrap; cursor: pointer; user-select: none; }
  .toggle-switch { position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink: 0; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-track { position: absolute; inset: 0; background: var(--surface2); border: 1px solid var(--border2); border-radius: 10px; cursor: pointer; transition: background 0.2s, border-color 0.2s; }
  .toggle-track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: var(--muted); border-radius: 50%; transition: transform 0.2s, background 0.2s; }
  .toggle-switch input:checked + .toggle-track { background: var(--purple3); border-color: var(--purple); }
  .toggle-switch input:checked + .toggle-track::after { transform: translateX(16px); background: var(--accent); }

  .hidden { display: none !important; }

  /* View toggle */
  .view-toggle { display: flex; border: 1px solid var(--border); border-radius: var(--radius2); overflow: hidden; }
  .view-btn { padding: 6px 11px; background: transparent; border: none; border-right: 1px solid var(--border); color: var(--text3); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .view-btn:last-child { border-right: none; }
  .view-btn.active { background: var(--tag-bg); color: var(--purple2); }

  /* ---- Results header ---- */
  .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
  .results-count { font-size: 13px; color: var(--text3); min-width: 0; }
  .view-toggle { flex-shrink: 0; }
  .results-count strong { color: var(--purple2); }

  /* ---- GRID VIEW ---- */
  #resultsGrid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
  }

  .img-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
    position: relative;
    display: block; /* grid default */
  }
  .img-card:hover, .img-card:focus-within { border-color: var(--purple3); transform: translateY(-2px); }
  .card-hit { position: absolute; inset: 0; z-index: 1; width: 100%; background: transparent; border: 0; padding: 0; cursor: pointer; border-radius: inherit; }
  .card-hit:focus-visible { outline: 2px solid var(--purple2); outline-offset: -2px; }
  .star-btn { position: absolute; top: 8px; left: 8px; z-index: 2; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border2); background: rgba(13,11,20,0.85); color: var(--text2); font-size: 16px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.15s, color 0.15s, border-color 0.15s; }
  .img-card:hover .star-btn, .img-card:focus-within .star-btn, .star-btn[aria-pressed="true"] { opacity: 1; }
  .star-btn[aria-pressed="true"] { color: #ffd166; border-color: rgba(255,209,102,0.5); }
  @media (hover: none) { .star-btn { opacity: 1; } }

  /* Grid thumbnail */
  .img-thumb { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: var(--bg3); }
  .img-card.icon-card .img-thumb { background: #fff; object-fit: contain; padding: 16px; }

  /* Grid footer bar */
  .img-grid-footer { padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; }
  .img-source-badge { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; padding: 3px 8px; border-radius: 4px; background: var(--tag-bg); color: var(--purple2); }
  .img-dims { font-size: 11px; color: var(--text3); }

  /* License badge — grid (absolute over image) */
  .license-badge { pointer-events: none; position: absolute; top: 8px; right: 8px; font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 600; letter-spacing: 0.05em; }
  .license-free { background: #1a1628; color: #7affb8; border: 1px solid rgba(127,255,184,0.25); }
  .license-cc0 { background: #1a1628; color: #7affb8; border: 1px solid rgba(127,255,184,0.25); }
  .license-ccby { background: #1a1628; color: #e5a423; border: 1px solid rgba(229,164,35,0.25); }

  /* List detail — hidden in grid mode */
  .img-list-detail { display: none; }

  /* ---- COMPACT VIEW ---- */
  #resultsGrid.compact-view {
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 8px;
  }
  #resultsGrid.compact-view .img-thumb { aspect-ratio: 1/1; }
  #resultsGrid.compact-view .img-grid-footer { display: none; }
  #resultsGrid.compact-view .license-badge { font-size: 8px; padding: 1px 5px; top: 4px; right: 4px; }
  #resultsGrid.compact-view .star-btn { width: 26px; height: 26px; font-size: 13px; top: 4px; left: 4px; }

  /* ---- LIST VIEW ---- */
  #resultsGrid.list-view {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #resultsGrid.list-view .img-card {
    display: grid;
    grid-template-columns: 220px 1fr;
    grid-template-rows: 1fr;
    border-radius: var(--radius2);
    overflow: hidden;
    transform: none !important;
    min-height: 150px;
  }

  #resultsGrid.list-view .img-card:hover { transform: none !important; }

  #resultsGrid.list-view .img-thumb {
    width: 220px;
    height: 150px;
    aspect-ratio: unset;
    object-fit: cover;
    display: block;
    border-radius: 0;
    grid-column: 1;
    grid-row: 1;
  }

  /* Hide grid-only elements in list view */
  #resultsGrid.list-view .img-grid-footer { display: none; }
  #resultsGrid.list-view .license-badge { display: none; }

  /* Show list detail in list view */
  #resultsGrid.list-view .img-list-detail {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 14px 18px;
    gap: 8px;
    grid-column: 2;
    grid-row: 1;
    min-width: 0;
  }

  /* List detail inner elements */
  .list-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .list-title { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 600; color: var(--accent); line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; flex: 1; }
  .list-source-badge { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; padding: 3px 8px; border-radius: 4px; background: var(--tag-bg); color: var(--purple2); flex-shrink: 0; white-space: nowrap; }
  .list-attrs { display: flex; flex-direction: column; gap: 3px; }
  .list-attr { font-size: 12px; display: flex; gap: 6px; }
  .list-attr-label { color: var(--muted); min-width: 70px; flex-shrink: 0; }
  .list-attr-val { color: var(--text2); }
  .list-license-pill { font-size: 11px; color: var(--text3); background: var(--tag-bg); border: 1px solid var(--border); border-radius: 5px; padding: 3px 9px; display: inline-block; }
  .list-cc-badge { font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 4px; letter-spacing: 0.05em; }
  .list-bottom { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .list-action { position: relative; z-index: 2; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; color: var(--purple2); background: transparent; border: 1px solid var(--border2); border-radius: 5px; padding: 5px 11px; cursor: pointer; white-space: nowrap; text-decoration: none; transition: background 0.15s; display: inline-block; }
  .list-action:hover { background: var(--tag-bg); }

  /* ---- States ---- */
  .state-box { text-align: center; padding: 60px 20px; color: var(--text3); }
  .state-box .big { font-size: 40px; margin-bottom: 12px; }
  .state-box p { font-size: 14px; }
  .spinner { width: 36px; height: 36px; border: 2px solid var(--border2); border-top-color: var(--purple); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden-count { color: var(--text3); }
  .empty-tips { list-style: none; display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 16px 0 4px; }
  .empty-tips li { font-size: 13px; color: var(--text2); }
  .tip-btn { background: var(--tag-bg); border: 1px solid var(--border2); color: var(--purple2); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; padding: 5px 12px; border-radius: 6px; cursor: pointer; margin-right: 6px; }
  .tip-btn:hover { border-color: var(--purple); }
  .empty-note { font-size: 12px !important; color: var(--text3); margin-top: 12px; }
  .scroll-status { text-align: center; padding: 28px 0 8px; color: var(--text3); font-size: 13px; min-height: 1px; }
  .scroll-status .spinner { width: 24px; height: 24px; margin: 0 auto 8px; }
  .scroll-status p { margin-bottom: 4px; }
  .error-msg { background: rgba(255,107,138,0.08); border: 1px solid rgba(255,107,138,0.2); border-radius: var(--radius2); color: var(--danger); padding: 12px 16px; font-size: 13px; margin-bottom: 16px; }

  /* ---- Modal ---- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(8,6,16,0.85); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  #modalOverlay { z-index: 110; }
  .modal { position: relative; background: var(--bg2); border: 1px solid var(--border2); border-radius: 16px; max-width: 1100px; width: 100%; max-height: 92vh; overflow-y: auto; display: grid; grid-template-columns: 3fr 2fr; transform: scale(0.96); transition: transform 0.2s; }
  .modal-overlay.open .modal { transform: scale(1); }
  .modal-img-pane { background: var(--bg3); border-radius: 16px 0 0 16px; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 420px; }
  .modal-img-pane img { width: 100%; height: 100%; object-fit: contain; display: block; transition: opacity 0.2s; }
  .modal-info-pane { padding: 28px 28px 24px; display: flex; flex-direction: column; gap: 20px; }
  .modal-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .modal-source-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--purple2); background: var(--tag-bg); padding: 4px 10px; border-radius: 6px; }
  .btn-close { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); width: 30px; height: 30px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color 0.15s, border-color 0.15s; flex-shrink: 0; }
  .btn-close:hover { color: var(--text); border-color: var(--border2); }
  .modal-nav { position: absolute; top: 50%; transform: translateY(-50%); background: var(--surface2); border: 1px solid var(--border); color: var(--muted); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color 0.15s, border-color 0.15s; z-index: 101; }
  .modal-nav:hover { color: var(--text); border-color: var(--border2); }
  .modal-nav:disabled { opacity: 0.3; cursor: default; }
  .modal-nav.prev { left: -48px; }
  .modal-nav.next { right: -48px; }
  .modal-title { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; color: var(--accent); line-height: 1.3; }
  .modal-attrs { display: flex; flex-direction: column; gap: 8px; }
  .attr-row { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
  .attr-label { width: 80px; flex-shrink: 0; color: var(--text3); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; padding-top: 1px; }
  .attr-val { color: var(--text2); flex: 1; word-break: break-all; }
  .license-info { background: var(--tag-bg); border: 1px solid var(--border); border-radius: var(--radius2); padding: 10px 14px; font-size: 12px; color: var(--text2); line-height: 1.5; }
  .license-info strong { color: var(--purple2); }
  .modal-size-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; }
  .credit-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius2); color: var(--text2); font-size: 12px; line-height: 1.5; padding: 8px 10px; word-break: break-word; margin-bottom: 8px; }
  .modal-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-copy[aria-pressed="true"] { color: #ffd166; border-color: rgba(255,209,102,0.5); }
  .url-copy-row { display: flex; gap: 8px; }
  .url-copy-row input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius2); color: var(--text3); font-family: 'DM Sans', sans-serif; font-size: 12px; padding: 8px 10px; outline: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn-copy { background: var(--surface2); border: 1px solid var(--border2); color: var(--purple2); font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; padding: 8px 14px; border-radius: var(--radius2); cursor: pointer; transition: background 0.15s; white-space: nowrap; }
  .btn-copy:hover { background: var(--tag-bg); }
  .btn-copy.copied { color: var(--success); }
  .btn-copy.failed { color: var(--danger); }
  .btn-copy:disabled { opacity: 0.6; cursor: default; }
  .btn-danger { color: var(--danger); border-color: rgba(255,107,138,0.35); }
  .btn-download { width: 100%; background: var(--purple3); border: 1px solid var(--purple); color: var(--accent); font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; padding: 13px; border-radius: var(--radius2); cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-download:disabled { opacity: 0.6; cursor: default; }
  .btn-download:hover { background: rgba(124,92,191,0.85); }
  .btn-open { width: 100%; background: transparent; border: 1px solid var(--border2); color: var(--text2); font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 10px; border-radius: var(--radius2); cursor: pointer; transition: border-color 0.15s, color 0.15s; text-align: center; text-decoration: none; display: block; }
  .btn-open:hover { border-color: var(--purple3); color: var(--purple2); }
  .btn-row { display: flex; flex-direction: column; gap: 8px; }

  /* ---- Collection panel ---- */
  .collection-panel { background: var(--bg2); border: 1px solid var(--border2); border-radius: 16px; max-width: 920px; width: 100%; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; }
  .collection-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 20px 24px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .collection-title { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; color: var(--accent); }
  .collection-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .collection-body { padding: 20px 24px; overflow-y: auto; }
  .collection-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; list-style: none; }
  .collection-item { position: relative; border-radius: var(--radius2); overflow: hidden; border: 1px solid var(--border); background: var(--surface); }
  .collection-item:hover, .collection-item:focus-within { border-color: var(--purple3); }
  .collection-item img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; background: var(--bg3); }
  .collection-item.icon-card img { background: #fff; object-fit: contain; padding: 12px; }
  .collection-remove { position: absolute; top: 6px; right: 6px; z-index: 2; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border2); background: rgba(13,11,20,0.85); color: var(--text2); font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .collection-remove:hover { color: var(--danger); border-color: rgba(255,107,138,0.5); }
  .collection-empty { text-align: center; color: var(--text3); padding: 40px 0; font-size: 14px; }

  /* ---- Accessibility ---- */
  :focus-visible { outline: 2px solid var(--purple2); outline-offset: 2px; }
  #searchQuery:focus-visible { outline: none; }
  .toggle-switch input:focus-visible + .toggle-track { outline: 2px solid var(--purple2); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation-duration: 1.5s !important; }
    .img-card:hover, .img-card:focus-within { transform: none; }
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }

  /* Load more button */
  .btn-load-more {
    display: block;
    margin: 32px auto 0;
    background: transparent;

</style>

<body>

<script>
// ---- Configuration ----
const ALL_SOURCES = ['pexels','unsplash','pixabay','openverse','wikimedia','nasa','iconify'];
const SOURCE_LABELS = { pexels:'Pexels', unsplash:'Unsplash', pixabay:'Pixabay', openverse:'Openverse', wikimedia:'Wikimedia', nasa:'NASA', iconify:'Iconify' };
const SOURCE_KEYS = Object.fromEntries(Object.entries(SOURCE_LABELS).map(([k, v]) => [v, k]));
const PER_SOURCE = 8;
const MIN_DIM = 500;          // drop images smaller than 500×500 when the source reports dimensions
const COPY_MAX_PX = 2000;     // cap on clipboard image size
const COLLECTION_KEY = 'luminary-collection';

// ---- API access ----
// Pexels, Unsplash and Pixabay need API keys. To keep them off this page, deploy proxy/worker.js
// and put its URL in PROXY_URL. Once searches work through the proxy, delete DIRECT_KEYS entirely
// and regenerate the three keys, since the current ones have been published in this file.
const PROXY_URL = '';
const DIRECT_KEYS = {
  pexels:   '1DQboNmA7nYSIxexbVctwCz6CrXEMEudhlCW5GxCw8C5tJfA1wf3DkKX',
  unsplash: 'dtzOYQ0iqydb5FdzbmJl72p2bW5l80QgyAHQkzNU8BY',
  pixabay:  '18017390-57da3d02482166a97cd417d7d',
};

function keyedFetch(service, params) {
  const qs = new URLSearchParams(params).toString();
  if (PROXY_URL) return fetch(`${PROXY_URL.replace(/\/+$/, '')}/${service}?${qs}`);
  const key = typeof DIRECT_KEYS === 'undefined' ? '' : DIRECT_KEYS[service];
  if (!key) return Promise.reject(new Error(`${SOURCE_LABELS[service]}: no proxy or API key configured`));
  const k = encodeURIComponent(key);
  if (service === 'pexels')   return fetch(`https://api.pexels.com/v1/search?${qs}`, { headers: { Authorization: key } });
  if (service === 'unsplash') return fetch(`https://api.unsplash.com/search/photos?${qs}&client_id=${k}`);
  if (service === 'pixabay')  return fetch(`https://pixabay.com/api/?${qs}&key=${k}`);
  return Promise.reject(new Error('Unknown service ' + service));
}

// ---- State ----
let activeSources = Object.fromEntries(ALL_SOURCES.map(s => [s, true]));
let viewMode = 'grid';
let licenseFilter = 'all';      // 'all' | 'free' | 'attribution'
let sizeFilter = 'all';         // 'all' | 'large' | 'xl'
let orientationFilter = 'all';  // 'all' | 'landscape' | 'portrait' | 'square'
let typeFilter = 'all';         // 'all' | 'photo' | 'illustration' | 'icon'

let currentQuery = '';
let pageState = {};
let exhausted = {};
let sourceCounts = {};
let allItems = [];
let displayedItems = [];
let seenIds = new Set();
let loading = false;
let loadToken = 0;              // bumped on every new search so late responses from an old search are ignored
let autoLoadPaused = false;

let currentModal = null;
let modalList = [];
let modalReturnFocus = null;
let collectionReturnFocus = null;
let collection = loadCollection();

const $ = id => document.getElementById(id);

// ---- Source toggles ----
function toggleChip(src) {
  activeSources[src] = !activeSources[src];
  const chip = $('chip-' + src);
  chip.classList.toggle('active', activeSources[src]);
  chip.setAttribute('aria-pressed', String(activeSources[src]));
  filtersChanged();
}

// ---- View mode ----
function setViewMode(mode) {
  viewMode = mode;
  ['grid', 'compact', 'list'].forEach(m => {
    const btn = $('btn-' + m);
    btn.classList.toggle('active', m === mode);
    btn.setAttribute('aria-pressed', String(m === mode));
  });
  applyViewClass();
}

function applyViewClass() {
  const grid = $('resultsGrid');
  grid.classList.toggle('list-view', viewMode === 'list');
  grid.classList.toggle('compact-view', viewMode === 'compact');
}

// ---- Filters ----
function orientationOf(img) {
  const r = img.width / img.height;
  return r > 1.05 ? 'landscape' : r < 1 / 1.05 ? 'portrait' : 'square';
}

// One test per active filter, keyed so explainEmpty() can ask "what if this one were off?"
function filterTests() {
  const t = {};
  if (ALL_SOURCES.some(s => !activeSources[s])) t.sources = img => activeSources[SOURCE_KEYS[img.source]];
  if (licenseFilter === 'free') t.license = img => img.isCC0;
  else if (licenseFilter === 'attribution') t.license = img => !img.isCC0;
  const min = sizeFilter === 'large' ? 1000 : sizeFilter === 'xl' ? 5000 : 0;
  if (min) t.size = img => img.width >= min && img.height >= min;
  if (orientationFilter !== 'all') t.orientation = img => img.width && img.height && orientationOf(img) === orientationFilter;
  if (typeFilter !== 'all') t.type = img => img.mediaType === typeFilter;
  return t;
}

function applyFilter(items, skip) {
  const tests = Object.entries(filterTests()).filter(([k]) => k !== skip).map(([, f]) => f);
  return items.filter(img => tests.every(f => f(img)));
}

// Mutually exclusive toggle groups: checking one unchecks the others; unchecking returns to 'all'
function exclusiveToggle(ids, mode, modes) {
  const el = $(ids[modes.indexOf(mode)]);
  ids.forEach(id => { if (id !== el.id) $(id).checked = false; });
  return el.checked ? mode : 'all';
}

function setLicenseFilter(mode) {
  licenseFilter = exclusiveToggle(['freeOnlyToggle', 'attrOnlyToggle'], mode, ['free', 'attribution']);
  filtersChanged();
}
function setSizeFilter(mode) {
  sizeFilter = exclusiveToggle(['lgOnlyToggle', 'xlOnlyToggle'], mode, ['large', 'xl']);
  filtersChanged();
}
function setOrientationFilter(mode) {
  orientationFilter = exclusiveToggle(['landscapeToggle', 'portraitToggle', 'squareToggle'], mode, ['landscape', 'portrait', 'square']);
  filtersChanged();
}
function setTypeFilter(mode) {
  typeFilter = exclusiveToggle(['photoToggle', 'illustrationToggle', 'iconToggle'], mode, ['photo', 'illustration', 'icon']);
  filtersChanged();
}

function clearFilter(key) {
  if (key === 'sources') ALL_SOURCES.forEach(s => { if (!activeSources[s]) toggleChip(s); });
  const groups = {
    license: ['freeOnlyToggle', 'attrOnlyToggle'],
    size: ['lgOnlyToggle', 'xlOnlyToggle'],
    orientation: ['landscapeToggle', 'portraitToggle', 'squareToggle'],
    type: ['photoToggle', 'illustrationToggle', 'iconToggle'],
  };
  if (!groups[key]) return;
  groups[key].forEach(id => { $(id).checked = false; });
  if (key === 'license') licenseFilter = 'all';
  if (key === 'size') sizeFilter = 'all';
  if (key === 'orientation') orientationFilter = 'all';
  if (key === 'type') typeFilter = 'all';
  filtersChanged();
}

function filterName(key) {
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  switch (key) {
    case 'license': return licenseFilter === 'free' ? 'No attribution' : 'Attribution only';
    case 'size': return sizeFilter === 'large' ? 'Large (1000+)' : 'Extra large (5000+)';
    case 'orientation': return cap(orientationFilter);
    case 'type': return cap(typeFilter);
  }
  return '';
}

function filtersChanged() {
  autoLoadPaused = false;
  if (!allItems.length) return;
  reRender();
  requestAnimationFrame(maybeAutoLoad);
}

// ---- Search ----
async function doSearch() {
  const q = $('searchQuery').value.trim();
  if (!q) return;
  if (!ALL_SOURCES.some(s => activeSources[s])) { showError('Select at least one source.'); return; }
  clearError();

  const token = ++loadToken;
  loading = true;
  autoLoadPaused = false;
  currentQuery = q;
  pageState = Object.fromEntries(ALL_SOURCES.map(s => [s, 1]));
  exhausted = Object.fromEntries(ALL_SOURCES.map(s => [s, false]));
  sourceCounts = Object.fromEntries(ALL_SOURCES.map(s => [s, 0]));
  allItems = [];
  displayedItems = [];
  seenIds = new Set();
  $('resultsGrid').innerHTML = '';
  renderStatus();

  const result = await fetchPage(q);
  if (token !== loadToken) return;
  applyPage(result);
  loading = false;
  reRender();
  announce(`${displayedItems.length} images found for ${q}.`);
  requestAnimationFrame(maybeAutoLoad);
}

async function loadMore() {
  if (loading || !currentQuery || !hasMore()) return;
  const token = loadToken;
  loading = true;
  clearError();
  updateScrollStatus();
  const result = await fetchPage(currentQuery);
  if (token !== loadToken) return;
  const added = applyPage(result);
  loading = false;
  const visible = applyFilter(added);
  appendCards(visible);
  // Stop auto-loading if a whole batch produced nothing visible, so filters can't trigger endless fetching
  if (!visible.length && added.length) autoLoadPaused = true;
  renderStatus();
  if (visible.length) announce(`${visible.length} more images loaded.`);
  requestAnimationFrame(maybeAutoLoad);
}

function resumeAutoLoad() {
  autoLoadPaused = false;
  loadMore();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const FETCHERS = {
  pexels: fetchPexels, unsplash: fetchUnsplash, pixabay: fetchPixabay,
  openverse: fetchOpenverse, wikimedia: fetchWikimedia, nasa: fetchNasa,
  iconify: fetchIconify,
};

// Fetchers don't touch shared state; applyPage() does, and only for the current search
async function fetchPage(q) {
  const sources = ALL_SOURCES.filter(s => activeSources[s] && !exhausted[s]);
  const results = await Promise.allSettled(sources.map(s => FETCHERS[s](q, pageState[s])));
  return { sources, results };
}

function applyPage({ sources, results }) {
  const added = [], errors = [];
  results.forEach((r, i) => {
    const src = sources[i];
    if (r.status !== 'fulfilled') { errors.push(r.reason); return; }
    const fresh = r.value.items.filter(img => !seenIds.has(img.id));
    fresh.forEach(img => seenIds.add(img.id));
    const items = fresh.filter(img => !img.width || !img.height || (img.width >= MIN_DIM && img.height >= MIN_DIM));
    added.push(...items);
    pageState[src]++;
    sourceCounts[src] += items.length;
    // A page of nothing but repeats means the source has run out, even if it claims otherwise
    if (r.value.done || !fresh.length) exhausted[src] = true;
  });
  shuffle(added);
  allItems.push(...added);
  added.forEach(measureImage);
  if (errors.length) showError(errors.map(e => e.message || String(e)).join(' · '));
  return added;
}

function hasMore() {
  return ALL_SOURCES.some(s => activeSources[s] && !exhausted[s]);
}

// ---- Per-source fetchers: each returns { items, done } ----
async function fetchPexels(q, page) {
  const res = await keyedFetch('pexels', { query: q, per_page: PER_SOURCE, page });
  if (!res.ok) throw new Error('Pexels: ' + res.status);
  const data = await res.json();
  const items = (data.photos || []).map(p => ({
    id: 'px_' + p.id, source: 'Pexels',
    title: p.alt || 'Pexels photo', photographer: p.photographer,
    thumb: p.src.large,
    srcSet: { small: p.src.small, medium: p.src.medium, large: p.src.large, original: p.src.original },
    width: p.width, height: p.height, pageUrl: p.url,
    license: 'Pexels License', licenseNote: 'Free to use for any purpose. No attribution required.', isCC0: true, mediaType: 'photo',
  }));
  return { items, done: !data.next_page };
}

async function fetchUnsplash(q, page) {
  const res = await keyedFetch('unsplash', { query: q, per_page: PER_SOURCE, page, content_filter: 'high' });
  if (!res.ok) throw new Error('Unsplash: ' + res.status);
  const data = await res.json();
  const items = (data.results || []).map(p => ({
    id: 'us_' + p.id, source: 'Unsplash',
    title: p.description || p.alt_description || 'Unsplash photo', photographer: p.user?.name,
    thumb: p.urls.regular,
    srcSet: { small: p.urls.thumb, medium: p.urls.small, large: p.urls.regular, original: p.urls.full },
    width: p.width, height: p.height, pageUrl: p.links.html,
    license: 'Unsplash License', licenseNote: 'Free to use for any purpose. No attribution required (appreciated).', isCC0: true, mediaType: 'photo',
  }));
  return { items, done: page >= (data.total_pages || 0) };
}

async function fetchPixabay(q, page) {
  const res = await keyedFetch('pixabay', { q, per_page: PER_SOURCE, page, safesearch: 'true' });
  if (!res.ok) throw new Error('Pixabay: ' + res.status);
  const data = await res.json();
  const items = (data.hits || []).map(p => ({
    id: 'pb_' + p.id, source: 'Pixabay',
    title: p.tags || 'Pixabay image', photographer: p.user,
    thumb: p.webformatURL,
    srcSet: { small: p.previewURL, medium: p.webformatURL, large: p.largeImageURL, original: p.fullHDURL || p.largeImageURL },
    width: p.imageWidth, height: p.imageHeight, pageUrl: p.pageURL,
    license: 'Pixabay License', licenseNote: 'Free for commercial and educational use. No attribution required.', isCC0: true,
    mediaType: (p.type === 'illustration' || p.type === 'vector') ? 'illustration' : 'photo',
  }));
  return { items, done: page * PER_SOURCE >= (data.totalHits || 0) };
}

async function fetchOpenverse(q, page) {
  const res = await fetch(`https://api.openverse.org/v1/images/?q=${encodeURIComponent(q)}&page_size=${PER_SOURCE}&page=${page}&license_type=commercial,modification`);
  if (!res.ok) throw new Error('Openverse: ' + res.status);
  const data = await res.json();
  const items = (data.results || []).map(p => {
    const licStr = (p.license || '').toLowerCase();
    const isCC0 = licStr.includes('cc0') || licStr === 'pdm';
    const licLabel = p.license_version ? (p.license || '').toUpperCase() + ' ' + p.license_version : (p.license || '').toUpperCase();
    return {
      id: 'ov_' + p.id, source: 'Openverse',
      title: p.title || 'Openverse image', photographer: p.creator || 'Unknown',
      thumb: p.thumbnail || p.url,
      srcSet: { small: p.thumbnail || p.url, medium: p.url, large: p.url, original: p.url },
      width: p.width || null, height: p.height || null,
      pageUrl: p.foreign_landing_url || p.url,
      license: licLabel, licenseNote: isCC0 ? 'CC0 — No rights reserved. Free to use without any attribution.' : 'CC BY — Free to use with attribution to the creator.',
      isCC0,
      mediaType: (p.category === 'illustration' || p.category === 'digitized_artwork') ? 'illustration' : 'photo',
    };
  });
  return { items, done: page >= (data.page_count || 0) };
}

async function fetchWikimedia(q, page) {
  const offset = (page - 1) * PER_SOURCE;
  const res = await fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrsearch=${encodeURIComponent(q)}&gsrlimit=${PER_SOURCE}&gsroffset=${offset}&prop=imageinfo&iiprop=url|extmetadata|size|mime&iiurlwidth=600&format=json&origin=*`);
  if (!res.ok) throw new Error('Wikimedia: ' + res.status);
  const data = await res.json();
  const pages = data.query?.pages || {};
  const items = Object.values(pages).filter(p => (p.imageinfo?.[0]?.mime || '').startsWith('image/')).map(p => {
    const info = p.imageinfo[0];
    const meta = info.extmetadata || {};
    const licShort = (meta.LicenseShortName?.value || '').toLowerCase();
    const isCC0 = licShort.includes('cc0') || licShort.includes('public domain') || licShort === 'pd';
    const licLabel = meta.LicenseShortName?.value || 'Wikimedia License';
    return {
      id: 'wm_' + p.pageid, source: 'Wikimedia',
      title: stripTags(meta.ImageDescription?.value || p.title.replace('File:', '')),
      photographer: stripTags(meta.Artist?.value || 'Unknown'),
      thumb: info.thumburl || info.url,
      srcSet: { small: info.thumburl || info.url, medium: info.thumburl || info.url, large: info.url, original: info.url },
      width: info.width || null, height: info.height || null,
      pageUrl: info.descriptionurl,
      license: licLabel, licenseNote: isCC0 ? 'Public domain / CC0 — Free to use without attribution.' : licLabel + ' — Attribution may be required.',
      isCC0, mediaType: (info.mime === 'image/svg+xml' || info.mime === 'image/png') ? 'illustration' : 'photo',
    };
  });
  return { items, done: !data.continue };
}

async function fetchNasa(q, page) {
  const res = await fetch(`https://images-api.nasa.gov/search?q=${encodeURIComponent(q)}&media_type=image&page=${page}&page_size=${PER_SOURCE}`);
  if (!res.ok) throw new Error('NASA: ' + res.status);
  const data = await res.json();
  const collectionData = data.collection || {};
  const items = (collectionData.items || []).filter(item => item.links?.length > 0).map(item => {
    const d = item.data[0];
    const thumb = item.links[0].href;
    return {
      id: 'nasa_' + d.nasa_id, source: 'NASA',
      title: d.title || 'NASA image', photographer: d.photographer || d.center || 'NASA',
      thumb,
      srcSet: { small: thumb, medium: thumb, large: thumb, original: thumb },
      width: null, height: null,
      pageUrl: `https://images.nasa.gov/details/${encodeURIComponent(d.nasa_id)}`,
      license: 'Public Domain', licenseNote: 'NASA public domain — Free to use. Courtesy credit to NASA appreciated.',
      isCC0: true, mediaType: 'photo',
    };
  });
  return { items, done: !(collectionData.links || []).some(l => l.rel === 'next') };
}

async function fetchIconify(q, page) {
  const offset = (page - 1) * PER_SOURCE;
  const res = await fetch(`https://api.iconify.design/search?query=${encodeURIComponent(q)}&limit=${PER_SOURCE}&start=${offset}`);
  if (!res.ok) throw new Error('Iconify: ' + res.status);
  const data = await res.json();
  // Iconify enforces a minimum page size larger than ours, so trim to keep offsets from overlapping
  const icons = (data.icons || []).slice(0, PER_SOURCE);
  const items = icons.map(icon => {
    const [prefix, name] = icon.split(':');
    // Iconify SVGs default to 1em sizing, which renders unreliably in <img>; request explicit pixel sizes
    const svgUrl = `https://api.iconify.design/${prefix}/${name}.svg?height=1024`;
    const previewUrl = `https://api.iconify.design/${prefix}/${name}.svg?height=256`;
    return {
      id: 'ic_' + icon, source: 'Iconify',
      title: name.replace(/[-_]/g, ' '), photographer: prefix,
      thumb: previewUrl,
      srcSet: { small: previewUrl, medium: previewUrl, large: svgUrl, original: svgUrl },
      width: null, height: null,
      pageUrl: `https://icon-sets.iconify.design/${prefix}/${name}/`,
      license: 'Open Source', licenseNote: 'Open source icon — Free to use. Check icon set license for details.',
      isCC0: true, mediaType: 'icon',
    };
  });
  return { items, done: offset + PER_SOURCE >= (data.total || 0) };
}

// ---- Measuring images whose source doesn't report dimensions ----
let measureRenderTimer = null;

function measureImage(img) {
  if ((img.width && img.height) || img.measuring) return;
  const src = safeUrl(img.srcSet.original || img.thumb);
  if (!src) return;
  img.measuring = true;
  const probe = new Image();
  probe.onload = () => {
    img.width = probe.naturalWidth || null;
    img.height = probe.naturalHeight || null;
    img.measuring = false;
    onMeasured(img);
  };
  probe.onerror = () => { img.measuring = false; onMeasured(img); };
  probe.src = src;
}

function onMeasured(img) {
  if (img._card?.isConnected) {
    img._card.querySelectorAll('.dims-short').forEach(el => { el.textContent = shortDims(img); });
    img._card.querySelectorAll('.dims-long').forEach(el => { el.textContent = longDims(img); });
    img._card.querySelector('.card-hit').setAttribute('aria-label', cardLabel(img));
  }
  if (currentModal === img) renderModalAttrs(img);
  // Size and orientation results depend on dimensions, so refresh once a burst of measurements settles
  if (sizeFilter !== 'all' || orientationFilter !== 'all') {
    clearTimeout(measureRenderTimer);
    measureRenderTimer = setTimeout(() => { reRender(); requestAnimationFrame(maybeAutoLoad); }, 300);
  }
}

function shortDims(img) { return img.width && img.height ? `${img.width}×${img.height}` : ''; }
function longDims(img) {
  if (img.width && img.height) return `${img.width} × ${img.height} px`;
  return img.measuring ? 'Measuring…' : 'Unknown';
}

// ---- Rendering ----
function cardLabel(img) {
  const license = img.isCC0 ? 'free to use' : 'attribution required';
  const dims = img.width && img.height ? `, ${img.width} by ${img.height} pixels` : '';
  return `${truncate(img.title, 120)} — ${img.source}, ${license}${dims}`;
}

function buildCard(img) {
  const card = document.createElement('div');
  card.className = 'img-card' + (img.mediaType === 'icon' ? ' icon-card' : '');
  card.setAttribute('role', 'listitem');
  card._item = img;
  img._card = card;

  const saved = inCollection(img.id);
  const badgeClass = img.isCC0 ? 'license-free' : 'license-ccby';
  const badgeLabel = img.isCC0 ? 'Free' : 'Attr';

  card.innerHTML =
    `<button type="button" class="card-hit" aria-label="${escHtml(cardLabel(img))}"></button>` +
    `<img class="img-thumb" src="${escHtml(safeUrl(img.thumb))}" alt="" loading="lazy">` +
    `<button type="button" class="star-btn" aria-pressed="${saved}" aria-label="Save to collection">${saved ? '&#x2605;' : '&#x2606;'}</button>` +
    `<div class="license-badge ${badgeClass}" aria-hidden="true">${badgeLabel}</div>` +
    `<div class="img-grid-footer" aria-hidden="true">
      <span class="img-source-badge">${escHtml(img.source)}</span>
      <span class="img-dims dims-short">${shortDims(img)}</span>
    </div>` +
    `<div class="img-list-detail">
      <div class="list-top">
        <div class="list-title">${escHtml(img.title)}</div>
        <span class="list-source-badge">${escHtml(img.source)}</span>
      </div>
      <div class="list-attrs">
        <div class="list-attr"><span class="list-attr-label">By</span><span class="list-attr-val">${escHtml(img.photographer || 'Unknown')}</span></div>
        <div class="list-attr"><span class="list-attr-label">Dimensions</span><span class="list-attr-val dims-long">${longDims(img)}</span></div>
        <div class="list-attr"><span class="list-attr-label">License</span><span class="list-attr-val">${escHtml(img.license)}</span></div>
      </div>
      <div class="list-bottom">
        <span class="list-license-pill">${escHtml(img.licenseNote)}</span>
        <span class="list-cc-badge ${badgeClass}">${badgeLabel}</span>
        <button type="button" class="list-action dl-btn">&#x2193; Download</button>
        <button type="button" class="list-action credit-btn">Copy credit</button>
        <a class="list-action" href="${escHtml(safeUrl(img.pageUrl))}" target="_blank" rel="noopener">Source &#x2197;</a>
      </div>
    </div>`;

  const hit = card.querySelector('.card-hit');
  hit.addEventListener('click', () => openModal(img, displayedItems, hit));
  card.querySelector('.star-btn').addEventListener('click', () => toggleCollection(img));
  const dl = card.querySelector('.dl-btn');
  dl.addEventListener('click', () => downloadItem(img, dl));
  const credit = card.querySelector('.credit-btn');
  credit.addEventListener('click', () => copyText(creditText(img), credit, 'Credit copied!'));
  return card;
}

function appendCards(items) {
  applyViewClass();
  const frag = document.createDocumentFragment();
  items.forEach(img => frag.appendChild(buildCard(img)));
  $('resultsGrid').appendChild(frag);
  displayedItems.push(...items);
}

function reRender() {
  // Keep keyboard focus on the same card (or its star) across a rebuild
  const active = document.activeElement;
  const focusedItem = active?.closest?.('.img-card')?._item;
  const focusedStar = active?.classList?.contains('star-btn');

  $('resultsGrid').innerHTML = '';
  displayedItems = [];
  appendCards(applyFilter(allItems));
  renderStatus();

  if (focusedItem?._card?.isConnected) focusedItem._card.querySelector(focusedStar ? '.star-btn' : '.card-hit').focus();
}

function buildBreakdown() {
  return ALL_SOURCES
    .filter(src => sourceCounts[src] > 0)
    .map(src => `${SOURCE_LABELS[src]} ${sourceCounts[src]}`)
    .join(' · ');
}

function renderStatus() {
  const header = $('resultsHeader');
  const stateBox = $('stateBox');
  if (!currentQuery) return;

  if (!allItems.length) {
    header.style.display = 'none';
    stateBox.style.display = 'block';
    stateBox.innerHTML = loading
      ? '<div class="spinner" aria-hidden="true"></div><p>Searching across sources…</p>'
      : `<div class="big" aria-hidden="true">&#x1F50D;</div><p>No results found for "${escHtml(currentQuery)}". Try different keywords or turn on more sources.</p>`;
    if (!loading) announce(`No results found for ${currentQuery}.`);
    updateScrollStatus();
    return;
  }

  const shown = displayedItems.length;
  const hidden = allItems.length - shown;
  const breakdown = buildBreakdown();
  let html = `<strong>${shown}</strong> image${shown === 1 ? '' : 's'}`;
  if (hidden) html += ` <span class="hidden-count">(${hidden} hidden by filters)</span>`;
  if (breakdown) html += ` &nbsp;—&nbsp; ${breakdown}`;
  $('resultsCount').innerHTML = html;
  header.style.display = 'flex';

  if (shown === 0) {
    stateBox.innerHTML = explainEmpty();
    stateBox.style.display = 'block';
  } else {
    stateBox.style.display = 'none';
  }
  updateScrollStatus();
}

// Tells the user which filter is hiding everything, with a button to turn it off
function explainEmpty() {
  const options = Object.keys(filterTests())
    .map(key => ({ key, count: applyFilter(allItems, key).length }))
    .filter(o => o.count > 0)
    .sort((a, b) => b.count - a.count);
  const dimsMatter = sizeFilter !== 'all' || orientationFilter !== 'all';
  const pending = dimsMatter ? allItems.filter(i => i.measuring).length : 0;
  const plural = n => `${n} image${n === 1 ? '' : 's'}`;

  let html = '<div class="big" aria-hidden="true">&#x1F50E;</div><p>None of the loaded images match all of your filters.</p>';
  if (options.length) {
    html += '<ul class="empty-tips">' + options.slice(0, 3).map(o => {
      const label = o.key === 'sources' ? 'Turn your switched-off sources back on' : `Turn off "${filterName(o.key)}"`;
      return `<li><button type="button" class="tip-btn" data-clear-filter="${o.key}">${escHtml(label)}</button>to see ${plural(o.count)}</li>`;
    }).join('') + '</ul>';
  } else if (!pending) {
    html += '<p>No single change would show results. Try turning off more than one filter, or search for something else.</p>';
  }
  if (pending) html += `<p class="empty-note">Still checking the size of ${plural(pending)}. They'll appear here if they match.</p>`;
  return html;
}

// ---- Infinite scroll ----
function sentinelNear() {
  return $('scrollStatus').getBoundingClientRect().top < window.innerHeight + 800;
}

function maybeAutoLoad() {
  if (currentQuery && allItems.length && !loading && !autoLoadPaused && hasMore() && !overlayOpen() && sentinelNear()) loadMore();
}

function updateScrollStatus() {
  const el = $('scrollStatus');
  if (!currentQuery || !allItems.length || !ALL_SOURCES.some(s => activeSources[s])) { el.innerHTML = ''; return; }
  if (loading) el.innerHTML = '<div class="spinner" aria-hidden="true"></div>Loading more images…';
  else if (!hasMore()) el.textContent = "You've reached the end of the results.";
  else if (autoLoadPaused) el.innerHTML = '<p>The last batch had no images that match your filters.</p><button type="button" class="btn-load-more" onclick="resumeAutoLoad()">Load more images</button>';
  else el.innerHTML = '';
}

new IntersectionObserver(entries => {
  if (entries.some(e => e.isIntersecting)) maybeAutoLoad();
}, { rootMargin: '0px 0px 800px 0px' }).observe($('scrollStatus'));

// ---- Overlays (image details + collection) ----
function isOpen(id) { return $(id).classList.contains('open'); }
function overlayOpen() { return isOpen('modalOverlay') || isOpen('collectionOverlay'); }

// Only the topmost dialog stays interactive; everything behind it is inert for keyboard and screen readers
function syncOverlays() {
  const modalOpen = isOpen('modalOverlay');
  const colOpen = isOpen('collectionOverlay');
  $('app').inert = modalOpen || colOpen;
  $('modalOverlay').inert = !modalOpen;
  $('collectionOverlay').inert = !colOpen || modalOpen;
  document.body.style.overflow = (modalOpen || colOpen) ? 'hidden' : '';
}

// ---- Image details modal ----
function openModal(img, list, returnFocus) {
  modalList = list || [img];
  modalReturnFocus = returnFocus || document.activeElement;
  showModalItem(img);
  $('modalOverlay').classList.add('open');
  syncOverlays();
  $('modalClose').focus();
}

function showModalItem(img) {
  currentModal = img;
  $('modalSource').textContent = img.source;
  $('modalTitle').textContent = img.title;
  const imgEl = $('modalImg');
  imgEl.alt = img.title;
  const isIcon = img.mediaType === 'icon';
  document.querySelector('.modal-img-pane').style.background = isIcon ? '#fff' : '';
  imgEl.style.padding = isIcon ? '32px' : '';

  const licenseEl = $('modalLicense');
  licenseEl.textContent = '';
  const strong = document.createElement('strong');
  strong.textContent = img.license;
  licenseEl.append(strong, ' — ' + img.licenseNote);

  $('modalCredit').textContent = creditText(img);
  $('modalOpen').href = safeUrl(img.pageUrl) || '#';
  const url = img.srcSet.original || img.thumb;
  $('modalUrl').value = url;
  imgEl.style.opacity = '0.5';
  imgEl.onload = () => { imgEl.style.opacity = '1'; };
  imgEl.src = safeUrl(url);
  renderModalAttrs(img);
  updateModalStar();
  updateModalNav();
}

function renderModalAttrs(img) {
  const attrs = $('modalAttrs');
  attrs.innerHTML = '';
  const row = (label, value) => {
    const div = document.createElement('div');
    div.className = 'attr-row';
    div.innerHTML = `<span class="attr-label">${label}</span><span class="attr-val"></span>`;
    div.lastChild.textContent = value;
    attrs.appendChild(div);
  };
  if (img.photographer) row('By', img.photographer);
  row('Size', longDims(img));
}

function navigateModal(dir) {
  if (!currentModal) return;
  const idx = modalList.findIndex(i => i.id === currentModal.id);
  const next = modalList[idx + dir];
  if (next) showModalItem(next);
}

function updateModalNav() {
  const idx = modalList.findIndex(i => i.id === currentModal.id);
  $('modalPrev').disabled = idx <= 0;
  $('modalNext').disabled = idx < 0 || idx >= modalList.length - 1;
}

function closeModal() {
  if (!isOpen('modalOverlay')) return;
  $('modalOverlay').classList.remove('open');
  syncOverlays();
  // Return focus to the card for the image last viewed, falling back to whatever opened the modal
  const card = currentModal?._card;
  const target = card?.isConnected && !isOpen('collectionOverlay') ? card.querySelector('.card-hit') : modalReturnFocus;
  currentModal = null;
  if (target?.isConnected) target.focus();
  requestAnimationFrame(maybeAutoLoad);
}

function closeModalOnBg(e) { if (e.target === $('modalOverlay')) closeModal(); }

// ---- Credits and clipboard ----
function creditText(img) {
  const title = truncate((img.title || 'Untitled').replace(/\s+/g, ' ').trim(), 120);
  const by = img.photographer && img.photographer !== 'Unknown' ? img.photographer.replace(/\s+/g, ' ').trim() : '';
  if (img.mediaType === 'icon') return `"${title}" icon from the ${by} icon set, via Iconify. License: ${img.license}. ${img.pageUrl}`;
  return `"${title}"${by ? ' by ' + by : ''}, via ${img.source}. License: ${img.license}. ${img.pageUrl}`;
}

function flash(btn, text, ok = true) {
  if (!btn.dataset.label) btn.dataset.label = btn.textContent;
  btn.textContent = text;
  btn.classList.toggle('copied', ok);
  btn.classList.toggle('failed', !ok);
  clearTimeout(btn._flashTimer);
  btn._flashTimer = setTimeout(() => {
    btn.textContent = btn.dataset.label;
    delete btn.dataset.label;
    btn.classList.remove('copied', 'failed');
  }, 1800);
}

function copyText(text, btn, okText = 'Copied!') {
  if (!navigator.clipboard?.writeText) { flash(btn, "Couldn't copy", false); return; }
  navigator.clipboard.writeText(text).then(() => flash(btn, okText), () => flash(btn, "Couldn't copy", false));
}

function copyUrl() { copyText($('modalUrl').value, $('copyBtn')); }
function copyCredit() { if (currentModal) copyText(creditText(currentModal), $('copyCreditBtn'), 'Credit copied!'); }

function copyImage() {
  const btn = $('copyImageBtn');
  if (!currentModal) return;
  if (!navigator.clipboard?.write || typeof ClipboardItem === 'undefined') { flash(btn, 'Not supported in this browser', false); return; }
  const url = safeUrl(currentModal.srcSet.large || currentModal.srcSet.original || currentModal.thumb);
  if (!url) return;
  btn.dataset.label = btn.textContent;
  btn.textContent = 'Copying…';
  // Passing a promise keeps the write inside the click's user gesture, which Safari requires
  const item = new ClipboardItem({ 'image/png': imageUrlToPng(url) });
  navigator.clipboard.write([item]).then(
    () => flash(btn, 'Image copied!'),
    () => flash(btn, "Couldn't copy — try Download", false)
  );
}

async function imageUrlToPng(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(res.status);
  const blob = await res.blob();
  if (blob.type.includes('svg')) return svgToPng(blob);
  const bmp = await createImageBitmap(blob);
  const scale = Math.min(1, COPY_MAX_PX / Math.max(bmp.width, bmp.height));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(bmp.width * scale);
  canvas.height = Math.round(bmp.height * scale);
  canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
  bmp.close?.();
  return canvasToPng(canvas);
}

function canvasToPng(canvas) {
  return new Promise((resolve, reject) =>
    canvas.toBlob(b => (b ? resolve(b) : reject(new Error('PNG conversion failed'))), 'image/png'));
}

// Rasterize an SVG blob to a transparent PNG at the SVG's intrinsic pixel size
function svgToPng(svgBlob) {
  return new Promise((resolve, reject) => {
    const src = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth || 1024;
      canvas.height = img.naturalHeight || 1024;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(src);
      canvasToPng(canvas).then(resolve, reject);
    };
    img.onerror = () => { URL.revokeObjectURL(src); reject(new Error('SVG load failed')); };
    img.src = src;
  });
}

// ---- Downloads ----
const EXTENSIONS = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif', 'image/avif': 'avif', 'image/tiff': 'tif', 'image/bmp': 'bmp' };

function fileSlug(img) {
  const slug = (img.title || '').toLowerCase().replace(/[^\w\s-]/g, '').trim().replace(/[\s_]+/g, '-').slice(0, 60).replace(/-+$/, '');
  return slug || 'luminary-image';
}

async function fetchImageBlob(img) {
  const url = safeUrl(img.srcSet.original || img.thumb);
  if (!url) throw new Error('Invalid image URL');
  const res = await fetch(url);
  if (!res.ok) throw new Error(res.status);
  const blob = await res.blob();
  return blob.type.includes('svg') ? svgToPng(blob) : blob;
}

function saveBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function downloadItem(img, btn) {
  const label = btn.textContent;
  btn.textContent = 'Downloading…';
  btn.disabled = true;
  try {
    const blob = await fetchImageBlob(img);
    saveBlob(blob, `${fileSlug(img)}.${EXTENSIONS[blob.type] || 'jpg'}`);
  } catch {
    // Some hosts block cross-origin downloads; opening the file lets the user save it manually
    const url = safeUrl(img.srcSet.original || img.thumb);
    if (url) window.open(url, '_blank', 'noopener');
  } finally {
    btn.textContent = label;
    btn.disabled = false;
  }
}

function downloadImage() { if (currentModal) downloadItem(currentModal, $('modalDownload')); }

// Minimal uncompressed ZIP writer; images are already compressed, so storing them is enough
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function makeZip(files) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const now = new Date();
  const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  for (const { name, data } of files) {
    const nameBytes = enc.encode(name);
    const crc = crc32(data);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);
    local.setUint16(4, 20, true);
    local.setUint16(6, 0x0800, true);          // UTF-8 file names
    local.setUint16(8, 0, true);               // stored
    local.setUint16(10, dosTime, true);
    local.setUint16(12, dosDate, true);
    local.setUint32(14, crc, true);
    local.setUint32(18, data.length, true);
    local.setUint32(22, data.length, true);
    local.setUint16(26, nameBytes.length, true);
    parts.push(local, nameBytes, data);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true);
    cd.setUint16(6, 20, true);
    cd.setUint16(8, 0x0800, true);
    cd.setUint16(10, 0, true);
    cd.setUint16(12, dosTime, true);
    cd.setUint16(14, dosDate, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, data.length, true);
    cd.setUint32(24, data.length, true);
    cd.setUint16(28, nameBytes.length, true);
    cd.setUint32(42, offset, true);
    central.push(cd, nameBytes);
    offset += 30 + nameBytes.length + data.length;
  }
  const cdSize = central.reduce((n, p) => n + p.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true);
  end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true);
  end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end], { type: 'application/zip' });
}

// ---- Collection ----
const STORED_FIELDS = ['id', 'source', 'title', 'photographer', 'thumb', 'srcSet', 'width', 'height', 'pageUrl', 'license', 'licenseNote', 'isCC0', 'mediaType'];

function loadCollection() {
  try {
    const parsed = JSON.parse(localStorage.getItem(COLLECTION_KEY) || '[]');
    return Array.isArray(parsed) ? parsed.filter(i => i && typeof i.id === 'string' && i.srcSet && typeof i.srcSet === 'object') : [];
  } catch {
    return [];
  }
}

function saveCollection() {
  try { localStorage.setItem(COLLECTION_KEY, JSON.stringify(collection)); } catch { /* storage unavailable; collection lasts for this visit */ }
}

function inCollection(id) { return collection.some(c => c.id === id); }

function toggleCollection(img) {
  if (inCollection(img.id)) collection = collection.filter(c => c.id !== img.id);
  else collection.push(Object.fromEntries(STORED_FIELDS.map(f => [f, img[f]])));
  saveCollection();
  refreshCollectionUI(img.id);
}

function toggleCollectionCurrent() { if (currentModal) toggleCollection(currentModal); }

function refreshCollectionUI(changedId) {
  $('collectionCount').textContent = collection.length;
  const item = changedId && allItems.find(i => i.id === changedId);
  const star = item?._card?.querySelector('.star-btn');
  if (star) {
    const saved = inCollection(changedId);
    star.setAttribute('aria-pressed', String(saved));
    star.innerHTML = saved ? '&#x2605;' : '&#x2606;';
  }
  if (currentModal) updateModalStar();
  if (isOpen('collectionOverlay')) renderCollection();
}

function updateModalStar() {
  const saved = inCollection(currentModal.id);
  const btn = $('modalStarBtn');
  btn.setAttribute('aria-pressed', String(saved));
  btn.innerHTML = saved ? '&#x2605; In collection' : '&#x2606; Save to collection';
}

function openCollection() {
  collectionReturnFocus = document.activeElement;
  renderCollection();
  $('collectionOverlay').classList.add('open');
  syncOverlays();
  $('collectionClose').focus();
}

function closeCollection() {
  if (!isOpen('collectionOverlay')) return;
  $('collectionOverlay').classList.remove('open');
  syncOverlays();
  if (collectionReturnFocus?.isConnected) collectionReturnFocus.focus();
  requestAnimationFrame(maybeAutoLoad);
}

function renderCollection() {
  const grid = $('collectionGrid');
  const n = collection.length;
  $('collectionTitle').textContent = `Your collection (${n})`;
  ['zipBtn', 'copyCreditsBtn', 'clearCollectionBtn'].forEach(id => { $(id).disabled = !n; });
  grid.innerHTML = '';
  if (!n) {
    grid.innerHTML = '<li class="collection-empty">Nothing saved yet. Use the &#x2606; on any image to add it here.</li>';
    return;
  }
  collection.forEach((img, i) => {
    const li = document.createElement('li');
    li.className = 'collection-item' + (img.mediaType === 'icon' ? ' icon-card' : '');
    li.innerHTML =
      `<button type="button" class="card-hit" aria-label="${escHtml(truncate(img.title, 120) + ' — ' + img.source)}"></button>` +
      `<img src="${escHtml(safeUrl(img.thumb))}" alt="" loading="lazy">` +
      `<button type="button" class="collection-remove" aria-label="Remove ${escHtml(truncate(img.title, 60))} from collection">&#x2715;</button>`;
    const hit = li.querySelector('.card-hit');
    hit.addEventListener('click', () => openModal(img, collection.slice(), hit));
    li.querySelector('.collection-remove').addEventListener('click', () => {
      toggleCollection(img);
      // Keep focus in the panel: move to the next remove button, or the close button if the list emptied
      const removes = grid.querySelectorAll('.collection-remove');
      (removes[Math.min(i, removes.length - 1)] || $('collectionClose')).focus();
    });
    grid.appendChild(li);
  });
}

function copyAllCredits() {
  copyText(collection.map(creditText).join('\n\n'), $('copyCreditsBtn'), 'Credits copied!');
}

function clearCollection() {
  if (!collection.length || !confirm(`Remove all ${collection.length} images from your collection?`)) return;
  const ids = collection.map(c => c.id);
  collection = [];
  saveCollection();
  ids.forEach(id => refreshCollectionUI(id));
  $('collectionClose').focus();
}

async function downloadCollectionZip() {
  if (!collection.length) return;
  const btn = $('zipBtn');
  btn.disabled = true;
  const items = collection.slice();
  const files = [], failed = [];
  for (let i = 0; i < items.length; i++) {
    btn.textContent = `Preparing ${i + 1} of ${items.length}…`;
    try {
      const blob = await fetchImageBlob(items[i]);
      const name = `${String(i + 1).padStart(2, '0')}-${fileSlug(items[i])}.${EXTENSIONS[blob.type] || 'jpg'}`;
      files.push({ name, data: new Uint8Array(await blob.arrayBuffer()) });
    } catch {
      failed.push(items[i]);
    }
  }
  let credits = items.map(creditText).join('\n\n') + '\n';
  if (failed.length) credits += '\nThese images could not be downloaded automatically. Open each page to save it:\n' + failed.map(f => `- ${f.pageUrl}`).join('\n') + '\n';
  files.push({ name: 'credits.txt', data: new TextEncoder().encode(credits) });
  saveBlob(makeZip(files), 'luminary-collection.zip');
  btn.disabled = false;
  btn.textContent = 'Download all (.zip)';
  flash(btn, failed.length ? `Done — ${failed.length} couldn't be added (see credits.txt)` : 'Downloaded!', !failed.length);
}

// ---- Helpers ----
function showError(msg) { const el = $('errorBox'); el.textContent = msg; el.classList.remove('hidden'); }
function clearError() { $('errorBox').classList.add('hidden'); }
function escHtml(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#x27;'); }
function safeUrl(url) { try { const u = new URL(url); return (u.protocol === 'https:' || u.protocol === 'http:') ? url : ''; } catch { return ''; } }
function stripTags(s) { return new DOMParser().parseFromString(String(s), 'text/html').body.textContent.trim(); }
function truncate(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

let announceTimer = null;
function announce(text) {
  clearTimeout(announceTimer);
  announceTimer = setTimeout(() => { $('srStatus').textContent = text; }, 400);
}

// ---- Events ----
$('stateBox').addEventListener('click', e => {
  const btn = e.target.closest('[data-clear-filter]');
  if (btn) clearFilter(btn.dataset.clearFilter);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (isOpen('modalOverlay')) closeModal();
    else if (isOpen('collectionOverlay')) closeCollection();
    return;
  }
  if (!isOpen('modalOverlay') || e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowLeft') navigateModal(-1);
  if (e.key === 'ArrowRight') navigateModal(1);
});

refreshCollectionUI();

// ---- Stashly Integration ----
async function sendToStashly() {
  if (!currentModal) return;
  const btn = $('stashlyBtn');
  const origText = btn.innerHTML;
  btn.textContent = 'Sending...';
  btn.disabled = true;
  const reset = () => { btn.innerHTML = origText; btn.style.borderColor = ''; btn.style.color = ''; btn.disabled = false; };

  try {
    const img = currentModal;
    const res = await fetch('http://127.0.0.1:9473/api/ingest', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        url: img.srcSet.original || img.srcSet.large || img.thumb,
        title: img.title || '',
        description: img.title || '',
        tags: (img.title || '').toLowerCase().split(/\s+/).filter(w => w.length > 3),
        source: img.source || '',
        photographer: img.photographer || '',
      }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || 'Failed');
    }
    btn.textContent = '✓ Sent!';
    btn.style.borderColor = '#10b981';
    btn.style.color = '#10b981';
    setTimeout(reset, 2000);
  } catch (e) {
    btn.textContent = e.message === 'Failed to fetch' ? '✗ Stashly not running' : '✗ ' + e.message;
    btn.style.borderColor = '#e63946';
    btn.style.color = '#e63946';
    setTimeout(reset, 3000);
  }
}
